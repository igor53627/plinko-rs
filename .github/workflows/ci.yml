name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plinko

      - name: Run plinko tests
        run: cargo test --manifest-path plinko/Cargo.toml

      - name: Run plinko tests without default features
        run: cargo test --manifest-path plinko/Cargo.toml --no-default-features

      - name: Run plinko tests with the experimental features
        run: cargo test --manifest-path plinko/Cargo.toml --features tee,gpu

      - name: Smoke test cost estimator binary
        run: |
          cargo run --manifest-path plinko/Cargo.toml --bin cost_estimate -- --entries 1000 > /dev/null
          cargo run --manifest-path plinko/Cargo.toml --bin cost_estimate -- --entries 1000 --json > /tmp/cost_estimate_entries.json
          python3 -m json.tool /tmp/cost_estimate_entries.json > /dev/null
          cargo run --manifest-path plinko/Cargo.toml --bin cost_estimate -- --mainnet --json > /tmp/cost_estimate_mainnet.json
          python3 -m json.tool /tmp/cost_estimate_mainnet.json > /dev/null

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plinko
            scripts/wasm_multilevel_smoke
            scripts/wasm_keyword_smoke

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check plinko library for wasm32-unknown-unknown
        run: |
          cargo check --manifest-path plinko/Cargo.toml --lib --no-default-features --target wasm32-unknown-unknown
          cargo check --manifest-path plinko/Cargo.toml --lib --no-default-features --features tee --target wasm32-unknown-unknown

      - name: Run 2-level Variant B WASM E2E smoke test
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/scripts/wasm_multilevel_smoke/target
        run: ./scripts/test_wasm_multilevel.sh

      - name: Run plinko::keyword KV-SCF WASM E2E smoke test
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/scripts/wasm_keyword_smoke/target
        run: ./scripts/test_wasm_keyword.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plinko

      - name: Run clippy on plinko
        run: cargo clippy --manifest-path plinko/Cargo.toml -- -W clippy::all

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --manifest-path plinko/Cargo.toml -- --check
          cargo fmt --manifest-path scripts/wasm_multilevel_smoke/Cargo.toml -- --check
          cargo fmt --manifest-path scripts/wasm_keyword_smoke/Cargo.toml -- --check

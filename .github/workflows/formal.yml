name: Formal Verification

on:
  push:
    branches: [main]
    paths:
      - 'plinko/formal/**'
      - 'docs/Plinko.v'
      - 'plinko/src/**'
      - 'plinko/Cargo.toml'
      - 'Cargo.toml'
      - '.github/workflows/formal.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plinko/formal/**'
      - 'docs/Plinko.v'
      - 'plinko/src/**'
      - 'plinko/Cargo.toml'
      - 'Cargo.toml'
      - '.github/workflows/formal.yml'

env:
  OPAMYES: 1
  OPAMJOBS: 2

jobs:
  rocq-proofs:
    name: Rocq Proofs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-rocq9-${{ runner.os }}-v2-${{ hashFiles('plinko/formal/Makefile', '.github/workflows/formal.yml') }}
          restore-keys: |
            opam-rocq9-${{ runner.os }}-v2-
            opam-rocq9-${{ runner.os }}-

      - name: Install opam
        run: |
          sudo apt-get update
          sudo apt-get install -y opam

      - name: Setup opam and Rocq 9.0
        if: steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          opam init --auto-setup --disable-sandboxing --bare
          opam switch create rocq-9 ocaml-base-compiler.4.14.2 || opam switch set rocq-9
          eval $(opam env --switch=rocq-9)
          opam repo add coq-released https://coq.inria.fr/opam/released || true
          opam update
          opam install -y rocq-prover.9.0.0 rocq-stdlib.9.0.0

      - name: Configure opam environment
        run: |
          echo "/home/runner/.opam/rocq-9/bin" >> $GITHUB_PATH
          # Debug: show available binaries
          echo "Available binaries in opam switch:"
          ls -la /home/runner/.opam/rocq-9/bin/ 2>/dev/null | grep -E "rocq|coq" | head -20 || echo "(bin dir not found)"
          # Create compatibility wrappers for tools that expect Coq-style CLIs.
          # Rocq 9.x uses `rocq <subcommand>` instead of separate binaries.
          rm -f /home/runner/.opam/rocq-9/bin/coqc
          cat > /home/runner/.opam/rocq-9/bin/coqc <<'EOF'
          #!/usr/bin/env bash
          exec rocq compile "$@"
          EOF
          chmod +x /home/runner/.opam/rocq-9/bin/coqc
          rm -f /home/runner/.opam/rocq-9/bin/rocqc
          cat > /home/runner/.opam/rocq-9/bin/rocqc <<'EOF'
          #!/usr/bin/env bash
          exec rocq compile "$@"
          EOF
          chmod +x /home/runner/.opam/rocq-9/bin/rocqc
          rm -f /home/runner/.opam/rocq-9/bin/coqdep
          cat > /home/runner/.opam/rocq-9/bin/coqdep <<'EOF'
          #!/usr/bin/env bash
          exec rocq dep "$@"
          EOF
          chmod +x /home/runner/.opam/rocq-9/bin/coqdep
          rm -f /home/runner/.opam/rocq-9/bin/rocqdep
          cat > /home/runner/.opam/rocq-9/bin/rocqdep <<'EOF'
          #!/usr/bin/env bash
          exec rocq dep "$@"
          EOF
          chmod +x /home/runner/.opam/rocq-9/bin/rocqdep
          rm -f /home/runner/.opam/rocq-9/bin/coq_makefile
          cat > /home/runner/.opam/rocq-9/bin/coq_makefile <<'EOF'
          #!/usr/bin/env bash
          exec rocq makefile "$@"
          EOF
          chmod +x /home/runner/.opam/rocq-9/bin/coq_makefile

      - name: Verify Rocq installation
        run: |
          echo "Checking rocq binary..."
          which rocq || echo "rocq not found"
          timeout 30 rocq --version || echo "rocq --version failed"
          # Verify compile subcommand works
          timeout 30 rocq compile --version || timeout 30 rocq -v || echo "rocq compile check failed"

      - name: Build Rocq specs and proofs
        run: |
          cd plinko/formal
          make clean
          make all

      - name: Run audit
        run: |
          cd plinko/formal
          make audit

      - name: Check the trust base (every Axiom, Parameter and Admitted has a note)
        run: |
          cd plinko/formal
          make verify-axioms

      - name: Compile the sketch docs/Plinko.v
        run: |
          cd plinko/formal
          make sketch

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plinko-audit
          path: plinko/formal/artifacts/audit.txt
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          cd plinko/formal
          ADMITS=$(make -s admit-count 2>/dev/null || echo "?")
          {
            echo "## Plinko Formal Verification Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Specs | ${{ job.status == 'success' && '[OK]' || '[FAIL]' }} |"
            echo "| Sims | ${{ job.status == 'success' && '[OK]' || '[FAIL]' }} |"
            echo "| Proofs | ${{ job.status == 'success' && '[OK]' || '[FAIL]' }} |"
            echo "| Admits | ${ADMITS} (each one is listed in docs/TRUST_BASE.md) |"
            echo ""
            echo "### Audit Report"
            echo '```'
            cat artifacts/audit.txt 2>/dev/null || echo "(not generated)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

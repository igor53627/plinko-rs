name: Kani Formal Verification

on:
  # Manual only - Kani verification is slow, run on-demand
  workflow_dispatch:

jobs:
  kani:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          if ! command -v rustup &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env"
          rustup default stable

      - name: Install Kani (if needed)
        run: |
          source "$HOME/.cargo/env"
          if ! command -v cargo-kani &> /dev/null; then
            cargo install --locked kani-verifier
            cargo kani setup
          fi

      - name: Run Kani proofs
        working-directory: plinko
        run: |
          source "$HOME/.cargo/env"
          # Pure integer arithmetic only; AES makes the other functions infeasible.
          cargo kani --harness proof_top_bits_mask_keeps_leading_bits --output-format terse

  proptest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run proptest harnesses
        working-directory: plinko
        run: |
          cargo test --lib kani_proofs -- --nocapture

name: Deploy to GitHub Pages

# Publishes the protocol demo only. No other file of docs/ goes to the site.
on:
  push:
    branches: [main]
    paths:
      - 'docs/protocol-visualization.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The second name keeps the link of the 0.2.0 README valid.
      - name: Build site
        run: |
          mkdir _site
          cp docs/protocol-visualization.html _site/index.html
          cp docs/protocol-visualization.html _site/protocol-visualization.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

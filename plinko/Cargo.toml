[package]
name = "plinko"
version = "0.4.0"
edition = "2021"
description = "Plinko PIR cryptographic primitives - invertible PRF, binomial sampling, constant-time operations"
license = "MIT"
repository = "https://github.com/igor53627/plinko-rs"
keywords = ["pir", "cryptography", "privacy", "ethereum"]
categories = ["cryptography", "algorithms"]

[features]
default = ["cli", "logging"]
# CLI binaries and the memory-mapped `Database40` helper. Disable with
# `default-features = false` for a library-only or `wasm32-unknown-unknown` build.
cli = [
    "dep:clap",
    "dep:eyre",
    "dep:indicatif",
    "dep:memmap2",
    "dep:serde",
    "dep:serde_json",
    "rand/std",
    "rand/std_rng",
]
# Experimental, not part of the trust model (docs/trust_model.md):
# constant-time PRP and iPRF variants and `plinko_hints --constant-time`.
tee = []
# Experimental, not part of the trust model: the `gpu` module and the
# `bench_gpu_hints` throughput benchmark. `cuda` adds the CUDA kernel.
gpu = []
parallel = ["gpu", "dep:rayon"]
cuda = ["gpu", "dep:cudarc", "dep:bytemuck"]
logging = ["dep:tracing", "dep:tracing-subscriber"]

[[bin]]
name = "plinko_hints"
path = "src/bin/plinko_hints.rs"
required-features = ["cli", "logging"]

[[bin]]
name = "cost_estimate"
path = "src/bin/cost_estimate.rs"
required-features = ["cli"]

[[bin]]
name = "gen_synthetic"
path = "src/bin/gen_synthetic.rs"
required-features = ["cli", "logging"]

[[bin]]
name = "protocol_scenario"
path = "src/bin/protocol_scenario.rs"
required-features = ["cli"]

[[bin]]
name = "bench_multilevel"
path = "src/bin/bench_multilevel.rs"
required-features = ["cli"]

[[bin]]
name = "bench_keyword"
path = "src/bin/bench_keyword.rs"
required-features = ["cli"]

[[bin]]
name = "bench_gpu_hints"
path = "src/bin/bench_gpu_hints.rs"
required-features = ["gpu", "cli"]

[[test]]
name = "hint_file_e2e_test"
path = "tests/hint_file_e2e_test.rs"
required-features = ["cli", "logging"]

[[test]]
name = "keyword_e2e_test"
path = "tests/keyword_e2e_test.rs"
required-features = ["cli", "logging"]

[dependencies]
clap = { version = "4.4", features = ["derive"], optional = true }
eyre = { version = "0.6", optional = true }
indicatif = { version = "0.17", optional = true }
sha2 = "0.10"
blake3 = "1.5"
rayon = { version = "1.10", optional = true }
aes = "0.8"
rand = { version = "0.8", default-features = false, features = ["alloc", "small_rng"] }
rand_chacha = "0.3"
memmap2 = { version = "0.9", optional = true }
tiny-keccak = { version = "2.0", features = ["keccak"] }
cudarc = { version = "0.12", optional = true, features = ["cuda-version-from-build-system"] }
bytemuck = { version = "1.14", optional = true, features = ["derive"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

# Kani configuration for formal verification
[package.metadata.kani]
# No special flags needed

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
